name: Daily Morning Briefing

# Runs at 06:45 UTC = 07:45 BST (British Summer Time, March-October).
# In winter (GMT, October-March) this fires at 06:45 local time — update
# cron to '45 7 * * 1-5' between last Sunday of October and last Sunday of March.
on:
  schedule:
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_REFRESH_TOKEN: ${{ secrets.MICROSOFT_REFRESH_TOKEN }}
          CLICKUP_API_KEY: ${{ secrets.CLICKUP_API_KEY }}
        run: |
          cat > /tmp/mcp.json << MCPEOF
          {
            "mcpServers": {
              "Microsoft-365": {
                "command": "npx",
                "args": ["-y", "@softeria/ms-365-mcp-server"],
                "env": {
                  "MS_CLIENT_ID": "${MICROSOFT_CLIENT_ID}",
                  "MS_CLIENT_SECRET": "${MICROSOFT_CLIENT_SECRET}",
                  "MS_TENANT_ID": "${MICROSOFT_TENANT_ID}",
                  "MS_REFRESH_TOKEN": "${MICROSOFT_REFRESH_TOKEN}"
                }
              },
              "ClickUp": {
                "command": "npx",
                "args": ["-y", "@clickup/mcp-server"],
                "env": {
                  "CLICKUP_API_KEY": "${CLICKUP_API_KEY}"
                }
              }
            }
          }
          MCPEOF

      - name: Run morning briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude \
            --model claude-sonnet-4-6 \
            --mcp-config /tmp/mcp.json \
            --max-turns 40 \
            --output-format text \
            -p "$(cat briefing/prompt.md)"
